---
apiVersion: v1
kind: Namespace
metadata:
  name: tracee
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracee
  namespace: tracee
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tracee
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tracee
subjects:
  - kind: ServiceAccount
    name: tracee
    namespace: tracee
roleRef:
  kind: ClusterRole
  name: tracee
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tracee
  namespace: tracee
  labels:
    app: tracee
spec:
  selector:
    matchLabels:
      app: tracee
  template:
    metadata:
      labels:
        app: tracee
    spec:
      serviceAccountName: tracee
      hostPID: true
      hostNetwork: true
      containers:
        - name: tracee
          # 0.24.1: older releases fail CO-RE relocation on the 6.11+ kernels of GKE COS.
          image: aquasec/tracee:0.24.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          args:
            - --output=json
            # Kept small on purpose: clock_gettime exhausted CPU, and higher-rate
            # events (e.g. sched_yield) overflowed the kubectl-logs pipeline.
            - --events=execve,openat,connect,futex
            # Container/pod enrichment via the GKE COS containerd socket.
            - --containers=enrich=true
            - --containers=sockets.containerd=/run/containerd/containerd.sock
            # Drop host-process events in the kernel, before the perf buffer.
            - --scope=container
            # Exposes tracee_ebpf_lostevents_total; the containerPort must be declared.
            - --server=metrics
            - --server=http-address=:3366
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 3366
              protocol: TCP
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: os-release
              mountPath: /etc/os-release-host
              readOnly: true
            # BTF for CO-RE, so Tracee does not download BTF at start.
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: tracee-tmp
              mountPath: /tmp/tracee
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: os-release
          hostPath:
            path: /etc/os-release
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: tracee-tmp
          hostPath:
            path: /tmp/tracee
